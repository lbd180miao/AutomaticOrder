<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端显示测试 - 泡棉检测</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1f2937;
        }
        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        button:hover {
            background: #2563eb;
        }
        #result-display {
            margin-top: 20px;
            padding: 20px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
        }
        .scenario {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>泡棉检测前端显示测试工具</h1>
    <p>此页面用于快速测试前端显示逻辑，无需后端服务器</p>

    <div class="test-card">
        <div class="test-title">📊 测试场景</div>
        <div class="scenario">
            <button onclick="testScenario1()">场景1: 左右均合格</button>
        </div>
        <div class="scenario">
            <button onclick="testScenario2()">场景2: 左侧覆盖不足</button>
        </div>
        <div class="scenario">
            <button onclick="testScenario3()">场景3: 左侧完全缺失</button>
        </div>
        <div class="scenario">
            <button onclick="testScenario4()">场景4: 左侧位置偏移</button>
        </div>
        <div class="scenario">
            <button onclick="testScenario5()">场景5: 左侧形状不完整</button>
        </div>
    </div>

    <div class="test-card">
        <div class="test-title">🔍 显示结果预览</div>
        <div id="result-display"></div>
    </div>

    <script>
        // 复制前端渲染逻辑（简化版）
        function renderSideResult(side, data, fullResult) {
            if (!data) return '';
            
            const sideName = side === 'left' ? '左侧' : '右侧';
            const coverageThreshold = 0.85;
            const iouThreshold = 0.70;
            const maxOffsetMm = 2.0;
            
            let status = '';
            if (data.is_present && data.is_aligned && data.is_complete) {
                status = `<span style="padding:4px 10px;border-radius:4px;background:#dcfce7;color:#059669;border:1px solid #10b981;font-weight:700;">✓ 合格</span>`;
            } else {
                const defect = getDefectReason(data);
                status = `<span style="padding:4px 10px;border-radius:4px;background:#fee2e2;color:#dc2626;border:1px solid #ef4444;font-weight:700;">✗ 不合格 (缺陷: ${defect})</span>`;
            }
            
            const coverage = data.coverage_ratio || 0;
            const detectedPixels = data.detected_pixels || 0;
            const standardPixels = data.standard_pixels || 0;
            const coveragePercent = (coverage * 100).toFixed(1) + '%';
            const pixelInfo = standardPixels ? ` (${detectedPixels} / ${standardPixels} 像素)` : '';
            const coverageWarning = coverage < coverageThreshold ? ' ⚠️ 低于' + (coverageThreshold * 100).toFixed(0) + '%阈值' : '';
            const coverageColor = coverage < coverageThreshold ? '#dc2626' : '#059669';
            
            const iou = data.iou;
            let iouDisplay = '';
            if (iou !== null && iou !== undefined) {
                const iouPercent = (iou * 100).toFixed(1) + '%';
                const iouWarning = iou < iouThreshold ? ' ⚠️ 低于' + (iouThreshold * 100).toFixed(0) + '%阈值' : '';
                const iouColor = iou < iouThreshold ? '#dc2626' : '#059669';
                iouDisplay = `<strong style="color:${iouColor}">${iouPercent}</strong>${iouWarning}`;
            } else {
                iouDisplay = '<span style="color:#9ca3af;">N/A (无标准模板)</span>';
            }
            
            const offsetMm = data.offset_distance_mm || 0;
            const offsetPxX = data.offset_x_px || 0;
            const offsetPxY = data.offset_y_px || 0;
            const offsetStr = offsetMm.toFixed(2) + ' mm';
            const offsetDetail = ` (${offsetPxX > 0 ? '+' : ''}${offsetPxX.toFixed(1)}px, ${offsetPxY > 0 ? '+' : ''}${offsetPxY.toFixed(1)}px)`;
            const offsetWarning = offsetMm > maxOffsetMm ? ' ⚠️ 超出' + maxOffsetMm.toFixed(1) + 'mm限值' : '';
            const offsetColor = offsetMm > maxOffsetMm ? '#dc2626' : '#059669';
            
            const score = data.score || 0;
            const scoreColor = score >= 0.8 ? '#059669' : '#dc2626';
            
            return `
                <div style="margin-bottom:20px;border:2px solid #e5e7eb;border-radius:8px;padding:14px;background:#fff;">
                    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:2px dashed #d1d5db;">
                        <span style="font-weight:800;font-size:15px;color:#374151;">━━━ ${sideName}泡棉 ━━━</span>
                        ${status}
                    </div>
                    <table style="width:100%;font-size:13px;line-height:2.2;">
                        <tr>
                            <td style="color:#6b7280;width:120px;"><strong>覆盖率:</strong></td>
                            <td style="font-family:monospace;"><strong style="color:${coverageColor}">${coveragePercent}</strong>${pixelInfo}${coverageWarning}</td>
                        </tr>
                        <tr>
                            <td style="color:#6b7280;"><strong>交并比(IoU):</strong></td>
                            <td style="font-family:monospace;">${iouDisplay}</td>
                        </tr>
                        <tr>
                            <td style="color:#6b7280;"><strong>位置偏移:</strong></td>
                            <td style="font-family:monospace;"><strong style="color:${offsetColor}">${offsetStr}</strong>${offsetDetail}${offsetWarning}</td>
                        </tr>
                        <tr>
                            <td style="color:#6b7280;"><strong>综合得分:</strong></td>
                            <td style="font-family:monospace;"><strong style="color:${scoreColor}">${score.toFixed(3)}</strong></td>
                        </tr>
                    </table>
                </div>
            `;
        }
        
        function getDefectReason(data) {
            if (!data) return '未检测';
            if (!data.is_present) {
                const coverage = data.coverage_ratio || 0;
                if (coverage < 0.05) {
                    return '缺失';
                } else {
                    return '覆盖不足';
                }
            }
            if (!data.is_aligned) return '位置偏移';
            if (!data.is_complete) return '形状不完整';
            return '未知';
        }
        
        function renderResult(data) {
            const leftHtml = renderSideResult('left', data.sides.left, data);
            const rightHtml = renderSideResult('right', data.sides.right, data);
            
            let finalBg = '';
            let finalColor = '';
            let finalText = '';
            if (data.is_passed) {
                finalBg = 'linear-gradient(135deg, #dcfce7 0%, #f0fdf4 100%)';
                finalColor = '#059669';
                finalText = '✓ 合格';
            } else {
                finalBg = 'linear-gradient(135deg, #fee2e2 0%, #fef2f2 100%)';
                finalColor = '#dc2626';
                
                const leftNG = data.sides.left && !data.sides.left.is_present;
                const rightNG = data.sides.right && !data.sides.right.is_present;
                if (leftNG && rightNG) {
                    finalText = '✗ 不合格 - 左右侧泡棉均缺失';
                } else if (leftNG) {
                    finalText = '✗ 不合格 - 左侧泡棉' + getDefectReason(data.sides.left);
                } else if (rightNG) {
                    finalText = '✗ 不合格 - 右侧泡棉' + getDefectReason(data.sides.right);
                } else {
                    const leftReason = getSideIssue(data.sides.left);
                    const rightReason = getSideIssue(data.sides.right);
                    if (leftReason && rightReason) {
                        finalText = `✗ 不合格 - 左侧${leftReason}，右侧${rightReason}`;
                    } else {
                        finalText = '✗ 不合格 - ' + (leftReason || rightReason || '质量不达标');
                    }
                }
            }
            
            const html = `
                <div style="padding:12px 16px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;margin-bottom:16px;">
                    <div style="font-weight:700;font-size:14px;color:#0369a1;">
                        【POS${data.position_index} 配方 - 第${data.position_index + 1}层泡棉检测】
                    </div>
                </div>
                ${leftHtml}
                ${rightHtml}
                <div style="padding:14px 18px;border-radius:6px;background:${finalBg};border:2px solid ${data.is_passed ? '#10b981' : '#ef4444'};">
                    <div style="font-weight:800;font-size:15px;margin-bottom:4px;">━━━ 最终判定 ━━━</div>
                    <div style="font-size:14px;font-weight:700;color:${finalColor};">${finalText}</div>
                </div>
            `;
            
            document.getElementById('result-display').innerHTML = html;
        }
        
        function getSideIssue(data) {
            if (!data || data.is_present && data.is_aligned && data.is_complete) return '';
            
            const issues = [];
            if (!data.is_present) {
                const coverage = data.coverage_ratio || 0;
                if (coverage < 0.05) {
                    issues.push('缺失');
                } else {
                    issues.push(`覆盖不足(${(coverage * 100).toFixed(1)}%)`);
                }
            }
            if (!data.is_aligned) issues.push('位置偏移');
            if (!data.is_complete) issues.push('形状不完整');
            
            return issues.join('、');
        }
        
        // 测试场景数据
        function testScenario1() {
            const data = {
                position_index: 0,
                is_passed: true,
                sides: {
                    left: {
                        is_present: true,
                        is_aligned: true,
                        is_complete: true,
                        coverage_ratio: 0.942,
                        detected_pixels: 3018,
                        standard_pixels: 3200,
                        iou: 0.885,
                        offset_x_px: 8.2,
                        offset_y_px: -6.1,
                        offset_distance_mm: 0.82,
                        score: 0.912
                    },
                    right: {
                        is_present: true,
                        is_aligned: true,
                        is_complete: true,
                        coverage_ratio: 0.961,
                        detected_pixels: 3075,
                        standard_pixels: 3200,
                        iou: 0.912,
                        offset_x_px: 5.1,
                        offset_y_px: -3.2,
                        offset_distance_mm: 0.51,
                        score: 0.941
                    }
                }
            };
            renderResult(data);
        }
        
        function testScenario2() {

                    left: {

                    }
                }
            };
            renderResult(data);
        }
        
        function testScenario3() {
            const data = {
                position_index: 0,

                sides: {
                    left: {

            };

        }
        
        function testScenario4() {
            const data = {
                position_index: 0,
                is_passed: false,
                sides: {
                    left: {
                        is_present: true,
                        is_aligned: false,

                    },
                    right: {

            };

        function testScenario5() {
            const data = {
                position_index: 0,
                is_passed: false,
                sides: {
                    left: {
                        is_present: true,
                        is_aligned: true,
                        is_complete: false,

                    },
                    right: {
                        is_present: true,

                        coverage_ratio: 0.942,

                        offset_y_px: -6.1,

                    }
                }
            };
            renderResult(data);
        }
        
        // 页面加载时显示第一个场景
        window.onload = function() {
            testScenario1();
        };
    </script>
</body>
</html>
