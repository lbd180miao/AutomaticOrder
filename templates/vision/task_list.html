{% extends "base.html" %}
{% block title %}视觉任务 - AutomaticBoxing{% endblock %}
{% block content %}
<section class="page-header"><h1>视觉模块</h1></section>

<section class="vision-module-cards" aria-label="视觉功能入口">
  <a class="vision-module-card" href="{% url 'vision:foam_inspector_interactive' %}">
    <div>
      <h2>泡棉检测（2D 相机）</h2>
      <p>检查泡棉覆盖率与位置偏移。</p>
    </div>
    <span class="vision-module-entry">进入工作台</span>
  </a>
  <a class="vision-module-card" href="{% url 'vision:rack_locator_panel' %}">
    <div>
      <h2>料架定位（3D 深度相机）</h2>
      <p>按配方与层号拍照，计算当前点位补偿。</p>
    </div>
    <span class="vision-module-entry">进入工作台</span>
  </a>
  <a class="vision-module-card" href="{% url 'vision:hand_eye_page' %}">
    <div>
      <h2>手眼标定 &amp; 坐标配置</h2>
      <p>管理相机与机器人之间的坐标转换。</p>
    </div>
    <span class="vision-module-entry">进入管理</span>
  </a>
  <a class="vision-module-card" href="{% url 'vision:task_history' %}">
    <div><h2>视觉历史记录</h2><p>查看 2D、3D 检测数据、结果与图片，按日期查询。</p></div>
    <span class="vision-module-entry">查看记录</span>
  </a>
</section>

<style>
.vision-module-cards {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
  margin: 16px 0 20px;
}

.vision-module-card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  text-decoration: none;
  transition: border-color .15s, background-color .15s;
}

.vision-module-card:hover {
  border-color: var(--primary, #2563eb);
  background: #f8faff;
  text-decoration: none;
}

.vision-module-card:focus-visible {
  outline: 3px solid var(--primary, #2563eb);
  outline-offset: 3px;
}

.vision-module-card h2 {
  margin: 0 0 6px;
  font-size: calc(18px + var(--ui-font-increase, 0px));
  color: #111827;
}

.vision-module-card p {
  margin: 0;
  color: #64748b;
  line-height: 1.6;
}

.vision-module-entry {
  flex-shrink: 0;
  color: var(--primary, #2563eb);
  font-weight: 600;
  font-size: calc(14px + var(--ui-font-increase, 0px));
}

@media (max-width: 600px) {
  .vision-module-card {
    padding: 16px;
    gap: 12px;
    align-items: flex-start;
    flex-direction: column;
  }
}
</style>

{% endblock %}
