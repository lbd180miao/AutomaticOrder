<section id="dp-panel" class="dp-dual-only" style="margin:0 0 14px;"
         data-cloud-match-url="{% url 'vision:rack_dual_point_cloud_match' %}"
         data-prepare-url="{% url 'vision:rack_dual_point_prepare' %}"
         data-save-url="{% url 'vision:rack_dual_point_save' %}">

  <p id="dp-mode-help" style="white-space:pre-wrap;"></p>
  <!-- ROI 目标标签 -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;">
    <label for="dp-rack-layers">识别模式：</label>
    <select id="dp-rack-layers" aria-label="识别模式">
      <option value="3">三层料架 · 三个铆钉</option>
      <option value="2">两层料架 · 横杆与参考点（两个铆钉）</option>
      <option value="single">单铆钉中心取点 · 直接画 ROI</option>
    </select>
    <div id="dp-targets" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    <button type="button" id="dp-save-recipe" class="btn btn-success" disabled>保存配方</button>
    <button type="button" id="dp-write-plc" class="btn btn-secondary" disabled>发送差值到 PLC</button>
    <span id="dp-draft-status" role="status"></span>
  </div>

  <!-- 状态行 -->
  <div id="dp-status" role="status"
       style="padding:8px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;white-space:pre-wrap;margin-bottom:10px;">
    选择配方并采集点云后，点击「开始计算」。
  </div>

      <section id="dp-single-results" class="dp-results dp-single-summary" hidden>
        <h3>铆钉检测结果 · 相机坐标</h3>
        <div class="dp-single-table-scroll" role="region" aria-label="铆钉坐标表，可横向滚动" tabindex="0">
          <table class="dp-single-table" aria-label="铆钉中心坐标">
            <thead><tr><th scope="col">编号</th><th scope="col">二维外观分/100</th><th scope="col">半径 (px)</th><th scope="col">有效点/采样点</th><th scope="col">u (px)</th><th scope="col">v (px)</th><th scope="col">X (mm)</th><th scope="col">Y (mm)</th><th scope="col">Z (mm)</th><th scope="col">三维坐标状态</th></tr></thead>
            <tbody id="dp-single-rows" aria-live="polite"></tbody>
          </table>
        </div>
        <p id="dp-single-coordinate" aria-live="polite"></p>
      </section>

  <!-- 主体：图像 + 结果 -->
  <div class="dp-layout">

    <!-- 图像列 -->
    <div class="dp-image-column">
      <div class="dp-image-hint">
        在原图拖动框选 · 框内拖动移动 · 右下角调整大小 · 坐标按原始像素保存
      </div>
      <div class="dp-image-scroll">
        <div id="dp-empty">
          先采集点云，再点击「开始计算」
          <small>按料架层数框选横杆及参考铆钉，保存标准模板</small>
        </div>
        <canvas id="dp-canvas" hidden style="display:none;width:100%;max-width:none;touch-action:none;cursor:crosshair;"></canvas>
      </div>
    </div>

    <!-- 结果列 -->
    <aside class="dp-results" aria-label="铆钉中心结果">
      <div id="dp-template-results">{% include "vision/rack_result_summary.html" with show_save_standard=True %}</div>

      <div class="dp-depth-result">
        <p id="dp-depth-source">采集或导入后显示对应点云</p>
        <canvas id="dp-depth-canvas" hidden aria-label="对应点云伪彩图，叠加 ROI 和铆钉中心"></canvas>
      </div>
    </aside>
  </div><!-- /.dp-layout -->

</section>

<style>
  #dp-targets button[hidden] { display: none; }
  /* 铆钉中心面板布局 */
  .dp-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.12fr) minmax(590px, 1fr);
    gap: 18px;
    margin-bottom: 12px;
  }
  #dp-draft-status { color: var(--text-muted); }
  .dp-image-hint {
    padding: 9px 12px;
    background: #f1f5f9;
    border: 1px solid #dbe2ea;
    border-radius: 6px 6px 0 0;
    color: #475569;
    font-size: 16px;
  }
  .dp-image-column, .dp-results { min-width: 0; }
  .dp-image-scroll {
    overflow: auto;
    max-height: 660px;
    background: #151f30;
    border-radius: 0 0 7px 7px;
    border: 1px solid #dbe2ea;
    border-top: 0;
  }
  #dp-empty {
    min-height: 290px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: #e2e8f0;
    gap: 10px;
  }
  #dp-empty[hidden] { display: none; }
  #dp-empty small { color: #94a3b8; display: block; margin-top: 6px; font-size: 16px; }
  .dp-results {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    background: #fafcff;
  }
  .dp-results h3 { font-size: 19px; margin: 0 0 10px; }
  .dp-results { display: flex; flex-direction: column; }
  .dp-depth-result { margin-top: auto; padding-top: 20px; }
  #dp-depth-canvas { display: block; width: 100%; height: auto; background: #151f30; border-radius: 6px; }
  #dp-depth-canvas[hidden] { display: none; }
  .dp-results p  { font-size: 16px; color: #526479; line-height: 1.6; }
  .dp-results table { border-collapse: collapse; width: 100%; font-size: 16px; }
  .dp-results td, .dp-results th {
    padding: 8px 7px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
    vertical-align: top;
  }
  .dp-results th { color: #475569; background: #f1f5f9; }
  .dp-single-summary { margin-bottom: 16px; }
  .dp-single-summary[hidden] { display: none; }
  .dp-single-summary h3 { margin-bottom: 12px; }
  .dp-single-table tbody tr:not(.dp-estimated-row) { background: #eff6ff; }
  .dp-single-table tbody td { padding-top: 14px; padding-bottom: 14px; }
  .dp-single-table-scroll { max-width: 100%; overflow-x: auto; }
  .dp-results .dp-single-table { font-size: 14px; font-variant-numeric: tabular-nums; }
  .dp-single-table th, .dp-single-table td { text-align: center; white-space: nowrap; border-right: 1px solid #e2e8f0; }
  .dp-results .dp-single-table th { background: #fff; }
  .dp-single-table th:last-child, .dp-single-table td:last-child { border-right: 0; }
  .dp-single-table .dp-coordinate-status { min-width: 170px; white-space: normal; }
  .dp-coordinate-status small { display: block; margin-top: 4px; color: #64748b; }
  .dp-estimated-row { background: #fffbeb; }
  .dp-camera-table-scroll { overflow-x: auto; }
  .dp-camera-table-scroll table { min-width: 520px; }
  #dp-point-results td { font-variant-numeric: tabular-nums; white-space: pre-line; }
  #dp-point-results th, #dp-point-results td:nth-child(5) { white-space: nowrap; }
  @media (max-width: 1120px) { .dp-layout { grid-template-columns: minmax(0, 1fr); } }
</style>
